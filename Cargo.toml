[package]
name = "lensy"
version = "0.2.1"
edition = "2024"

[dependencies]
topcoat = { version = "=0.12.1", default-features = false, features = [
    "asset",
    "compression",
    "cookie",
    "discover",
    "font-fontsource",
    "icon-iconify",
    "multipart",
    "runtime",
    "serve",
    "tailwind",
    "tower",
    "ui",
] }
tokio = { version = "1", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tokio-util = { version = "0.7", features = ["io"] }
http-body = "1"
http-body-util = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "sqlite-bundled",
    "macros",
    "migrate",
] }
serde = { version = "1", features = ["derive"] }
toml = { version = "1", default-features = false, features = [
    "std",
    "serde",
    "parse",
] }
url = "2"
garde = { version = "0.23", features = ["derive", "url"] }
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "webp",
] }
webp = { version = "0.3", default-features = false }
tempfile = "3"
getrandom = "0.4"
hex = "0.4"
sha2 = "0.11"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
chrono-tz = "0.10"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "ansi",
    "env-filter",
    "fmt",
] }
tower = "0.5"
tower-http = { version = "0.7", features = ["request-id", "trace"] }

[build-dependencies]
topcoat = { version = "=0.12.1", default-features = false, features = [
    "icon-iconify",
    "tailwind",
] }
